<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astronaut Bruno Tristan's Planet Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🚀 Astronaut Bruno Tristan's Planet Explorer</h1>
    <div class="guide">
      <button id="bruno" aria-label="Astronaut Bruno Tristan. Tap to hear him talk!">
        <svg viewBox="0 -12 120 162" width="88" height="119" aria-hidden="true">
          <defs>
            <linearGradient id="suit" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd8ea"/>
            </linearGradient>
            <radialGradient id="visor" cx="0.35" cy="0.3" r="0.9">
              <stop offset="0" stop-color="#3b5bd6"/><stop offset="0.6" stop-color="#1b2a6b"/><stop offset="1" stop-color="#0a1033"/>
            </radialGradient>
            <radialGradient id="helmet" cx="0.35" cy="0.3" r="0.8">
              <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3e6"/>
            </radialGradient>
          </defs>
          <!-- oxygen tanks + backpack -->
          <rect x="14" y="64" width="12" height="44" rx="6" fill="#8fa0c4"/>
          <rect x="94" y="64" width="12" height="44" rx="6" fill="#8fa0c4"/>
          <rect x="20" y="60" width="80" height="58" rx="12" fill="#b8c4dc"/>
          <!-- legs, knee pads, boots -->
          <rect x="38" y="106" width="18" height="30" rx="8" fill="url(#suit)"/>
          <rect x="64" y="106" width="18" height="30" rx="8" fill="url(#suit)"/>
          <ellipse cx="47" cy="121" rx="7" ry="4" fill="#dfe5f2" stroke="#b8c4dc"/>
          <ellipse cx="73" cy="121" rx="7" ry="4" fill="#dfe5f2" stroke="#b8c4dc"/>
          <path d="M34 134 h24 v6 a4 4 0 0 1 -4 4 h-17 a5 5 0 0 1 -5 -5z" fill="#5a6478"/>
          <path d="M62 134 h24 v5 a5 5 0 0 1 -5 5 h-17 a4 4 0 0 1 -4 -4z" fill="#5a6478"/>
          <rect x="34" y="132" width="24" height="5" rx="2" fill="#4d6bff"/>
          <rect x="62" y="132" width="24" height="5" rx="2" fill="#4d6bff"/>
          <!-- left arm with glove -->
          <rect x="12" y="70" width="18" height="34" rx="9" fill="url(#suit)"/>
          <rect x="12" y="96" width="18" height="5" rx="2" fill="#ffd23f"/>
          <circle cx="21" cy="107" r="8" fill="#4d6bff"/>
          <rect x="13" y="103" width="5" height="9" rx="2.5" fill="#3a55e0"/>
          <!-- right arm waving -->
          <g class="wave">
            <rect x="90" y="40" width="18" height="38" rx="9" fill="url(#suit)"/>
            <rect x="90" y="44" width="18" height="5" rx="2" fill="#ffd23f"/>
            <circle cx="99" cy="37" r="8" fill="#4d6bff"/>
            <rect x="102" y="28" width="5" height="9" rx="2.5" fill="#3a55e0"/>
          </g>
          <!-- body -->
          <rect x="30" y="62" width="60" height="50" rx="16" fill="url(#suit)"/>
          <!-- air hose -->
          <path d="M33 70 q-10 14 6 24" stroke="#8fa0c4" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- mission patch -->
          <circle cx="80" cy="73" r="6" fill="#1b2a6b" stroke="#ffd23f" stroke-width="1.5"/>
          <path d="M80 69.5 l1 2.4 2.6 .2 -2 1.7 .6 2.5 -2.2 -1.4 -2.2 1.4 .6 -2.5 -2 -1.7 2.6 -.2z" fill="#ffd23f"/>
          <!-- name patch -->
          <rect x="38" y="72" width="34" height="12" rx="3" fill="#ffd23f"/>
          <text x="55" y="81.5" text-anchor="middle" font-size="9" font-weight="bold"
                font-family="Trebuchet MS, sans-serif" fill="#1a1a40">BRUNO</text>
          <!-- chest control panel -->
          <rect x="42" y="87" width="36" height="14" rx="3" fill="#5a6478"/>
          <rect x="45" y="90" width="11" height="8" rx="1.5" fill="#7fe0a8"/>
          <path d="M46 95 l2 -2 2 2 2 -3 2 2" stroke="#1f7a4a" stroke-width="1" fill="none"/>
          <circle cx="62" cy="94" r="2.5" fill="#ff5c7a"/>
          <circle cx="68.5" cy="94" r="2.5" fill="#ffd23f"/>
          <circle cx="75" cy="94" r="2.5" fill="#2fbf71"/>
          <!-- belt -->
          <rect x="30" y="103" width="60" height="6" fill="#9aa8c4"/>
          <rect x="55" y="102" width="10" height="8" rx="2" fill="#ffd23f"/>
          <!-- helmet -->
          <rect x="46" y="58" width="28" height="8" rx="3" fill="#9aa8c4"/>
          <circle cx="60" cy="34" r="30" fill="url(#helmet)"/>
          <circle cx="29" cy="36" r="5" fill="#9aa8c4"/><circle cx="29" cy="36" r="2.5" fill="#ff5c7a"/>
          <circle cx="91" cy="36" r="5" fill="#9aa8c4"/><circle cx="91" cy="36" r="2.5" fill="#ff5c7a"/>
          <rect x="35" y="17" width="50" height="34" rx="16" fill="url(#visor)" stroke="#9aa8c4" stroke-width="3"/>
          <!-- face behind visor -->
          <circle cx="52" cy="35" r="3" fill="#ffd23f"/>
          <circle cx="68" cy="35" r="3" fill="#ffd23f"/>
          <path d="M52 42 q8 6 16 0" stroke="#ffd23f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- visor shine -->
          <path d="M42 26 q7 -6 16 -3" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <circle cx="78" cy="23" r="2" fill="#ffffff" fill-opacity="0.6"/>
          <!-- antenna -->
          <line x1="72" y1="7" x2="78" y2="-4" stroke="#9aa8c4" stroke-width="2.5" stroke-linecap="round"/>
          <circle class="blink" cx="79" cy="-6" r="3.5" fill="#ff5c7a"/>
        </svg>
      </button>
      <p id="bubble" class="bubble" aria-live="polite"></p>
    </div>
    <nav>
      <button class="tab active" data-tab="explore">🪐<span>Explore</span></button>
      <button class="tab" data-tab="compare">⚖️<span>Compare</span></button>
      <button class="tab" data-tab="fly">🚀<span>Fly</span></button>
      <button class="tab" data-tab="quiz">❓<span>Quiz</span></button>
      <button class="tab" data-tab="stickers">🏅<span>Stickers</span></button>
    </nav>
  </header>

  <main>
    <section id="explore" class="panel active">
      <p class="hint">Tap a planet to learn about it!</p>
      <div id="system"></div>
      <button id="pause" class="big-btn">⏸️ Pause</button>
    </section>

    <section id="compare" class="panel">
      <div class="card">
        <h2>📏 How big?</h2>
        <div class="pickers">
          <select id="sizeA" aria-label="First planet"></select>
          <span class="vs">vs</span>
          <select id="sizeB" aria-label="Second planet"></select>
        </div>
        <div id="sizeView"></div>
        <p id="sizeText" class="say"></p>
      </div>
      <div class="card">
        <h2>⚖️ How much would I weigh?</h2>
        <div class="weight-input">
          <label for="weight">I weigh <strong id="weightValue"></strong></label>
          <input type="range" id="weight" min="20" max="250" value="50">
          <div class="unit-toggle">
            <button class="unit active" data-unit="lb">pounds</button>
            <button class="unit" data-unit="kg">kilograms</button>
          </div>
        </div>
        <div id="weightGrid"></div>
      </div>
    </section>

    <section id="fly" class="panel">
      <div class="card">
        <h2>🚀 Fly with Bruno</h2>
        <p class="hint">Where should we fly from Earth?</p>
        <div id="destinations"></div>
        <div class="trip">
          <div class="trip-end" id="tripFrom"></div>
          <div class="trip-track">
            <div class="rocket" aria-hidden="true">
              <svg viewBox="0 0 80 40" width="80" height="40">
                <g class="flame">
                  <path d="M15 20 L0 11 L5 20 L0 29 Z" fill="#ff9f1c"/>
                  <path d="M15 20 L6 15 L9 20 L6 25 Z" fill="#ffd23f"/>
                </g>
                <path d="M18 10 l-6 -8 h10 l8 8z" fill="#4d6bff"/>
                <path d="M18 30 l-6 8 h10 l8 -8z" fill="#4d6bff"/>
                <path d="M14 10 h40 q18 0 24 10 q-6 10 -24 10 h-40 z" fill="#fff" stroke="#b8c4dc" stroke-width="1.5"/>
                <path d="M62 11.5 q12 2 15.5 8.5 q-3.5 6.5 -15.5 8.5 z" fill="#ff5c7a"/>
                <text x="27" y="22.5" text-anchor="middle" font-size="6" font-weight="bold"
                      font-family="Trebuchet MS, sans-serif" fill="#1a1a40">BRUNO</text>
                <circle cx="48" cy="20" r="7" fill="#1b2a6b" stroke="#9aa8c4" stroke-width="2.5"/>
                <circle cx="46" cy="19" r="1.2" fill="#ffd23f"/>
                <circle cx="50.5" cy="19" r="1.2" fill="#ffd23f"/>
                <path d="M45.5 22 q2.7 2.2 5.4 0" stroke="#ffd23f" stroke-width="1" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <div class="trip-end" id="tripTo"></div>
        </div>
        <p id="tripText" class="say"></p>
        <div id="travelGrid"></div>
      </div>
    </section>

    <section id="quiz" class="panel">
      <div id="quizBox" class="card"></div>
    </section>

    <section id="stickers" class="panel">
      <div class="card">
        <h2>🏅 My Sticker Book</h2>
        <p id="stickerCount" class="say"></p>
        <div id="stickerGrid"></div>
      </div>
    </section>
  </main>

  <div id="factCard" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="card fact">
      <button class="close" aria-label="Close">✕</button>
      <div class="fact-pic"></div>
      <h2 class="fact-name"></h2>
      <p class="badge"></p>
      <ul class="fact-list"></ul>
      <div class="fact-nav">
        <button class="big-btn prev" aria-label="Previous">◀</button>
        <button class="big-btn speak">🔊 Read to me</button>
        <button class="big-btn next" aria-label="Next">▶</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="stickers.js"></script>
  <script src="explore.js"></script>
  <script src="compare.js"></script>
  <script src="fly.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
